[project]
name = "mlex_image_classification"
version = "0.2.1"
description = ""
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tensorflow-io[tensorflow]==0.32.0",
    "tensorflow_probability==0.15",
    "pandas==2.1.1",
    "Pillow>=10.2.0",
    "pyarrow>=14.0.1",
    "pydantic==1.8.2",
    "dvclive[tf]",
    "dvc-objects<=1.3.2",
    "imageio",
    "numpy<2.0.0",
    "tiled[client]==0.1.0a118",
    "pyFAI==2023.9.0",
    "pyyaml",
    "requests"
]

[tool.setuptools.packages]
find = { where = ["src"] }

[project.optional-dependencies]
# These are required for developing the package (running the tests, building
# the documentation) but not necessarily required for _using_ it.
dev = [
    "black==24.2.0",
    "flake8==7.0.0",
    "pre-commit==3.6.2",
    "isort==5.13.2",
    "pytest"
]

macos = [
    "tensorflow-io[tensorflow]==0.36.0",
    "tensorflow_probability==0.23.0",
    "pandas==2.1.1",
    "Pillow>=10.2.0",
    "pyarrow>=14.0.1",
    "pydantic==1.8.2",
    "dvclive[tf]",
    "dvc-objects<=1.3.2",
    "imageio",
    "numpy<2.0.0",
    "tiled[client]==0.1.0a118",
    "pyFAI==2023.9.0",
    "pyyaml",
    "requests"
]

[tool.isort]
profile = "black"
